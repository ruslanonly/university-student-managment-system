version: '3.8'

services:
    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: my_database
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./logs/postgres:/var/log/postgresql
            - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/init.sql
        command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=/var/log/postgresql", "-c", "log_statement=all"]

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
            - ./logs/redis:/var/log/redis
            - ./migrations/redis.sh:/docker-entrypoint-initdb.d/redis_migration.sh
        entrypoint: ["/docker-entrypoint-initdb.d/redis_migration.sh"]
    
    mongodb:
        image: mongo:latest
        container_name: mongodb
        environment:
            MONGO_INITDB_ROOT_USERNAME: user
            MONGO_INITDB_ROOT_PASSWORD: password
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
            - ./logs/mongo:/var/log/mongodb
            - ./migrations/mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
volumes:
    postgres_data:
    redis_data:
    mongo_data:
    es_data:
    neo4j_data:
