version: '3.8'

services:
    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: my_database
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./logs/postgres:/var/log/postgresql
            - ./migrations/students_pg.sql:/docker-entrypoint-initdb.d/init.sql
        command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=/var/log/postgresql", "-c", "log_statement=all"]

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
            - ./logs/redis:/var/log/redis
        command: ["redis-server", "--logfile", "/var/log/redis/redis.log"]

    mongodb:
        image: mongo:latest
        container_name: mongodb
        environment:
            MONGO_INITDB_ROOT_USERNAME: user
            MONGO_INITDB_ROOT_PASSWORD: password
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
            - ./logs/mongo:/var/log/mongodb
            - ./migrations/students_mongo.js:/docker-entrypoint-initdb.d/init-mongo.js

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200"
            - "9300:9300"
        volumes:
             - es_data:/usr/share/elasticsearch/data
             - ./logs/elasticsearch:/usr/share/elasticsearch/logs

    neo4j:
        image: neo4j:latest
        container_name: neo4j
        environment:
            NEO4J_AUTH: neo4j/password
        ports:
            - "7474:7474"
            - "7687:7687"
        volumes:
            - neo4j_data:/data
            - ./logs/neo4j:/logs
            - ./migrations/students-neo4j.cql:/var/lib/neo4j/import/init-neo4j.cql

volumes:
    postgres_data:
    redis_data:
    mongo_data:
    es_data:
    neo4j_data:
